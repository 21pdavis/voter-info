# Render Blueprint — declares all four persistent environments:
#   - voter-info-api      (API prod, tracks main, Neon `main` branch)
#   - voter-info-api-qa   (API qa,   tracks qa,   Neon `qa` branch)
#   - voter-info-web      (mobile app's web export, prod, tracks main)
#   - voter-info-web-qa   (mobile app's web export, qa,   tracks qa)
# `dev` has no deployed Render service — that's your local machine (API
# against the Neon `dev` branch, mobile via `expo start --web`).
#
# All services are CI-gated, not auto-deployed: GitHub Actions pings each
# service's own deploy hook only after typecheck + build pass for that branch.
# See .github/workflows/ci.yml.
services:
  - type: web
    name: voter-info-api
    runtime: node
    plan: free
    branch: main
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set these in the Render dashboard (Environment tab) — Neon `main`
      # branch connection string + prod Clerk keys. Leave DATABASE_URL blank
      # to run on bundled sample data instead of a real database.
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  - type: web
    name: voter-info-web
    runtime: static
    branch: main
    buildCommand: cd apps/mobile && npm install && npx expo export --platform web
    staticPublishPath: apps/mobile/dist
    autoDeploy: false
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://voter-info-api.onrender.com
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false

  - type: web
    name: voter-info-web-qa
    runtime: static
    branch: qa
    buildCommand: cd apps/mobile && npm install && npx expo export --platform web
    staticPublishPath: apps/mobile/dist
    autoDeploy: false
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://voter-info-api-qa.onrender.com
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false

  - type: web
    name: voter-info-api-qa
    runtime: node
    plan: free
    branch: qa
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Neon `qa` branch connection string + (usually the same dev-instance)
      # Clerk keys. Leave DATABASE_URL blank to run on sample data.
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
