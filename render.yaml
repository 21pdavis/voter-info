# Render Blueprint — deploys the API as a persistent web service.
# Create a new Blueprint in the Render dashboard and point it at this repo.
services:
  - type: web
    name: voter-info-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    # Deploys are CI-gated: GitHub Actions pings the deploy hook only after
    # typecheck + build pass. See .github/workflows/ci.yml.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set these in the Render dashboard (Environment tab). Leave blank to run
      # without a database (the API falls back to bundled sample data).
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
